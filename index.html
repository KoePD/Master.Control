<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KØ-PÅDD Ultra App</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000;
            --accent: #ffcc00;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #0284c7;
            --border: #1a1a1a;
        }

        /* Fjerner alle standard nettleser-stiler og tvinger app-oppførsel */
        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box; 
            outline: none; 
        }

        html, body { 
            height: 100vh; 
            width: 100vw; 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: white; 
            font-family: -apple-system, system-ui, sans-serif; 
            overflow: hidden; 
            position: fixed;
        }
        
        body { 
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; 
            display: flex; 
            flex-direction: column; 
        }

        .container { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            width: 100%; 
        }

        /* Match ID - Smalere bar for å gi plass til knapper */
        .top-nav { 
            background: #000; 
            border-bottom: 1px solid var(--border); 
            flex: 0 0 auto; 
        }
        .name-input {
            background: transparent; border: none; color: var(--accent);
            padding: 10px 0; text-align: center; font-size: 14px;
            width: 100%; font-weight: 700; text-transform: uppercase;
            opacity: 0.5;
        }

        /* BALL-SEKSJONEN: Fyller midten perfekt uten tomrom */
        .pool-section {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .ball-grid {
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            justify-items: center; 
            width: 100%; 
            max-width: 420px;
        }

        .ball-btn {
            width: 92px; /* Store, fete kuler */
            height: 92px; 
            border-radius: 50%; border: 3px solid #000;
            position: relative; display: flex; justify-content: center; align-items: center;
            overflow: hidden; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        .ball-btn:active { transform: scale(0.9); opacity: 0.5; }
        .num-label {
            background: white; color: black; width: 28px; height: 28px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
            font-weight: 900; border: 1px solid black; z-index: 10;
        }
        .stripe-band { position: absolute; width: 100%; height: 38%; z-index: 1; }
        .sunk { opacity: 0.02 !important; filter: grayscale(1); transform: scale(0.8); }

        /* BUNN-KONTROLLER: Nå helt massive */
        .bottom-controls { 
            flex: 0 0 auto; 
            display: flex;
            flex-direction: column;
        }

        .mode-row { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            background: #000; 
            border-top: 2px solid var(--border); 
        }
        .mode-row button {
            background: transparent; border: 1px solid var(--border); padding: 22px 0;
            color: #666; font-size: 14px; font-weight: 900;
        }
        .mode-row button:active { background: #111; color: var(--accent); }

        .action-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            background: var(--border); 
            gap: 1px; 
        }

        .btn-main { 
            background: #000; 
            border: none; 
            color: white; 
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-main:active { background: #111; }

        /* Høyere knapper for bedre app-følelse */
        .btn-status { padding: 35px 10px; font-size: 16px; }
        .btn-start { color: var(--green); }
        .btn-stop { color: var(--red); }

        /* SPILLERKNAPPER: Ekstremt store flater */
        .btn-player { padding: 55px 10px; font-size: 26px; }
        .active-l { background: var(--green) !important; color: white !important; }
        .active-r { background: var(--blue) !important; color: white !important; }

        .btn-sub { padding: 28px 10px; font-size: 12px; }
        .btn-foul { color: #f87171; background: #080000; }
        
        .extension-btn { 
            grid-column: span 2; 
            padding: 30px; 
            color: var(--blue); 
            border-top: 1px solid var(--border); 
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <input type="text" id="matchIDInput" class="name-input" placeholder="Lim inn Match ID" oninput="updateMatchID()">
    </div>

    <div class="pool-section">
        <div class="ball-grid" id="ball-grid"></div>
    </div>

    <div class="bottom-controls">
        <div class="mode-row">
            <button onclick="reputtActiveBalls()">♻️</button>
            <button onclick="toggleBallSet()">🎨</button>
            <button onclick="resetPool(9)">9</button>
            <button onclick="resetPool(10)">10</button>
            <button onclick="resetPool(8)">8</button>
        </div>

        <div class="action-grid">
            <button class="btn-main btn-status btn-start" onclick="startMatch()">🟢 START MATCH</button>
            <button class="btn-main btn-status btn-stop" onclick="avsluttMatch()">🔴 STOPP</button>
            
            <button id="btnL" class="btn-main btn-player" onclick="shotReset('left')">◀ S 1</button>
            <button id="btnR" class="btn-main btn-player" onclick="shotReset('right')">S 2 ▶</button>
            
            <button class="btn-main btn-sub btn-foul" onclick="addFoul('left')">⚠ FOUL S1</button>
            <button class="btn-main btn-sub btn-foul" onclick="addFoul('right')">⚠ FOUL S2</button>

            <button id="toggleBtn" class="btn-main btn-sub" onclick="sendClock('toggle')">▶ PAUSE / PLAY</button>
            <button class="btn-main btn-sub" style="color: var(--accent);" onclick="startBreak()">⚡ 60s BREAK</button>
            
            <button class="btn-main btn-sub extension-btn" onclick="useExtension()">+ BRUK EXTENSION</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let lastResetTime = Date.now();
    let ballStyle = 'classic'; 
    let currentGameMode = 9;

    function vibe(ms = 50) { if (navigator.vibrate) navigator.vibrate(ms); }

    function updateMatchID() {
        db.ref('settings/cueScoreMatchID').set(document.getElementById('matchIDInput').value);
    }

    function toggleBallSet() {
        vibe();
        ballStyle = (ballStyle === 'classic') ? 'dark' : 'classic';
        db.ref('settings/ballStyle').set(ballStyle);
        renderBalls();
    }

    function reputtActiveBalls() {
        vibe();
        db.ref('balls').once('value', snap => {
            let u = snap.val() || {};
            for (let i in u) { if (u[i] === false) u[i] = true; }
            db.ref('balls').set(u);
        });
    }

    const grid = document.getElementById('ball-grid');
    for (let i = 1; i <= 15; i++) {
        const b = document.createElement('div');
        b.id = `btn-${i}`; b.className = 'ball-btn';
        let numLabel = document.createElement('div'); numLabel.className = 'num-label'; numLabel.innerText = i; b.appendChild(numLabel);
        let band = document.createElement('div'); band.id = `band-${i}`; band.className = 'stripe-band'; b.appendChild(band);
        b.onclick = () => {
            vibe(30);
            const ref = db.ref(`balls/${i}`);
            ref.once('value').then(snap => {
                const isSinking = snap.val() !== false;
                ref.set(!isSinking);
            });
        };
        grid.appendChild(b);
    }

    function renderBalls() {
        const data = window.currentActiveData || {};
        const colors = ["", "#ffcc00", "#0055aa", "#cc0000", "#ff66aa", "#663399", "#007744", "#884422", "#000"];
        for (let i = 1; i <= 15; i++) {
            const b = document.getElementById(`btn-${i}`);
            if (!b) continue;
            let show = (currentGameMode == 8) || (currentGameMode == 9 && i <= 9) || (currentGameMode == 10 && i <= 10);
            b.style.display = show ? 'flex' : 'none';
            b.classList.toggle('sunk', data[i] === false);
            if (i <= 8) { b.style.background = colors[i]; document.getElementById(`band-${i}`).style.display='none'; }
            else {
                document.getElementById(`band-${i}`).style.display='block';
                document.getElementById(`band-${i}`).style.background = colors[i-8];
                b.style.background = (ballStyle === 'dark') ? 'black' : 'white';
            }
        }
    }

    function startMatch() { 
        vibe(100); 
        db.ref('stats').update({ startTime: Date.now() }); 
        db.ref('shotclock/visibility').set(true); 
        db.ref('activePlayer').set(""); 
        resetPool(currentGameMode); 
    }
    
    function avsluttMatch() { 
        vibe(100); 
        if(confirm("AVSLUTT?")) { 
            db.ref('shotclock/visibility').set(false); 
            db.ref('stats').update({ startTime: 0 }); 
            db.ref('activePlayer').set(null); 
            db.ref('balls').set(null); 
            db.ref('shotclock/cmd').set({ action: 'stop' }); 
        } 
    }
    
    function shotReset(player) { 
        vibe(40); 
        db.ref('activePlayer').set(player); 
        db.ref('shotclock/cmd').set({ action: 'reset30', ts: Date.now() }); 
    }
    
    function resetPool(max) { 
        vibe(60); 
        let updates = {}; 
        const limit = (max === 8) ? 15 : max; 
        for (let i = 1; i <= 15; i++) updates[i] = (i <= limit) ? true : null; 
        db.ref('balls').set(updates); 
        db.ref('gameMode').set(max); 
    }
    
    function addFoul(player) { vibe(60); db.ref(`stats/fouls/${player}`).transaction(c => (c || 0) + 1); }
    function startBreak() { vibe(60); db.ref('shotclock/cmd').set({action:'reset60', ts:Date.now()}); }
    function useExtension() { vibe(60); db.ref('activePlayer').once('value', s => { if (s.val()) db.ref(`stats/extensions/${s.val()}`).transaction(c => (c || 0) + 1); }); db.ref('shotclock/cmd').set({action:'extension', ts:Date.now()}); }
    function sendClock(cmd) { vibe(40); db.ref('shotclock/cmd').set({ action: cmd, ts: Date.now() }); }

    db.ref('activePlayer').on('value', snap => {
        const p = snap.val();
        document.getElementById('btnL').className = `btn-main btn-player ${p === 'left' ? 'active-l' : ''}`;
        document.getElementById('btnR').className = `btn-main btn-player ${p === 'right' ? 'active-r' : ''}`;
    });
    db.ref('gameMode').on('value', snap => { currentGameMode = snap.val() || 9; renderBalls(); });
    db.ref('balls').on('value', snap => { window.currentActiveData = snap.val() || {}; renderBalls(); });
</script>
</body>
</html>
