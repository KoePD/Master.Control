<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KØ-PÅDD Ultra Pro Max</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000;
            --accent: #ffcc00;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #0284c7;
            --border: #1a1a1a;
            --ball-shine: rgba(255,255,255,0.45);
            --ball-shadow: rgba(0,0,0,0.5);
            --btn-bg: #0d0d0d;
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; outline: none; }

        html, body { 
            height: 100vh; width: 100vw; margin: 0; padding: 0; 
            background: var(--bg); color: white; font-family: -apple-system, sans-serif; 
            overflow: hidden; position: fixed;
        }
        
        body { padding: env(safe-area-inset-top) 8px 0 8px; display: flex; flex-direction: column; }

        .container { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            width: 100%; 
            justify-content: flex-start;
        }

        .top-nav { padding: 5px 0; flex: 0 0 auto; display: flex; justify-content: center; }
        .name-input {
            background: var(--btn-bg); border: 1px solid var(--border); color: var(--accent);
            text-align: center; font-size: 20px; width: 100%; max-width: 420px; 
            font-weight: 900; text-transform: uppercase; padding: 10px; border-radius: 10px;
        }

        .pool-section { 
            flex: 0 0 auto;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            padding: 10px 0;
        }
        .ball-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 15px 25px;
            justify-items: center; width: 100%; max-width: 420px;
        }

        .ball-btn {
            width: 28vw; height: 28vw; max-width: 110px; max-height: 110px;
            border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.6);
            position: relative; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at 35% 35%, var(--ball-shine) 0%, rgba(255,255,255,0) 50%), 
                        radial-gradient(circle at 65% 65%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%), #fff;
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.4), 4px 6px 10px rgba(0,0,0,0.6);
        }
        
        .num-label {
            background: white; color: black; width: 55%; height: 55%; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; 
            font-size: 5vw; font-weight: 900; border: 1px solid rgba(0,0,0,0.8); z-index: 10;
        }
        
        .stripe-band { position: absolute; width: 100%; height: 38%; z-index: 1; }
        .sunk { opacity: 0.03 !important; filter: grayscale(1); transform: scale(0.8); }

        .bottom-controls { 
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .mode-container { display: flex; flex-direction: column; gap: 4px; }
        .mode-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .mode-btn {
            background: var(--btn-bg); border: 1px solid #222; padding: 12px 0;
            color: #eee; font-size: 13px; font-weight: 800; border-radius: 8px;
        }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .btn-main { 
            background: var(--btn-bg); border: 1px solid #222; color: white; 
            font-weight: 900; text-transform: uppercase; border-radius: 10px;
        }

        .btn-status { padding: 18px 5px; font-size: 14px; }
        .btn-player { padding: 35px 5px; font-size: 26px; }
        .active-l { background: var(--green) !important; }
        .active-r { background: var(--blue) !important; }

        .btn-sub { padding: 20px 5px; font-size: 13px; }
        
        .bottom-row { grid-column: span 2; display: grid; grid-template-columns: 1fr 1.2fr; gap: 4px; }

        /* Her er den store Extension-knappen nederst */
        .btn-extension-huge { 
            grid-column: span 2; padding: 22px; color: var(--blue); 
            font-size: 20px; border-color: rgba(2, 132, 199, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <input type="text" id="matchIDInput" class="name-input" placeholder="MATCH ID" oninput="updateMatchID()">
    </div>

    <div class="pool-section">
        <div class="ball-grid" id="ball-grid"></div>
    </div>

    <div class="bottom-controls">
        <div class="mode-container">
            <div class="mode-row">
                <button class="mode-btn" style="grid-column: span 2; border-color: var(--green);" onclick="reputtActiveBalls()">♻️ RESIRKULER</button>
                <button class="mode-btn" onclick="toggleBallSet()">🎨 STIL</button>
            </div>
            <div class="mode-row">
                <button class="mode-btn" onclick="resetPool(9)">9-BALL</button>
                <button class="mode-btn" onclick="resetPool(10)">10-BALL</button>
                <button class="mode-btn" onclick="resetPool(8)">8-BALL</button>
            </div>
        </div>

        <div class="action-grid">
            <button class="btn-main btn-status btn-start" onclick="startMatch()">🟢 START</button>
            <button class="btn-main btn-status btn-stop" onclick="avsluttMatch()">🔴 STOPP</button>
            
            <button id="btnL" class="btn-main btn-player" onclick="shotReset('left')">◀ S1</button>
            <button id="btnR" class="btn-main btn-player" onclick="shotReset('right')">S2 ▶</button>
            
            <button class="btn-main btn-sub btn-foul" onclick="addFoul('left')">⚠ FOUL S1</button>
            <button class="btn-main btn-sub btn-foul" onclick="addFoul('right')">⚠ FOUL S2</button>

            <div class="bottom-row">
                <button id="toggleBtn" class="btn-main btn-sub" onclick="sendClock('toggle')">▶ PAUSE</button>
                <button class="btn-main btn-sub" style="color: var(--accent); border-color: rgba(255, 204, 0, 0.3);" onclick="startBreak()">⚡ 60s BREAK</button>
            </div>
            
            <button class="btn-main btn-extension-huge" onclick="useExtension()">+ BRUK EXTENSION</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let ballStyle = 'classic'; 
    let currentGameMode = 9;

    function vibe(ms = 50) { if (navigator.vibrate) navigator.vibrate(ms); }

    function updateMatchID() { db.ref('settings/cueScoreMatchID').set(document.getElementById('matchIDInput').value); }
    function toggleBallSet() { vibe(); ballStyle = (ballStyle === 'classic') ? 'dark' : 'classic'; db.ref('settings/ballStyle').set(ballStyle); renderBalls(); }
    function reputtActiveBalls() { vibe(); db.ref('balls').once('value', snap => { let u = snap.val() || {}; for (let i in u) { if (u[i] === false) u[i] = true; } db.ref('balls').set(u); }); }

    const grid = document.getElementById('ball-grid');
    for (let i = 1; i <= 15; i++) {
        const b = document.createElement('div');
        b.id = `btn-${i}`; b.className = 'ball-btn';
        let numLabel = document.createElement('div'); numLabel.className = 'num-label'; numLabel.innerText = i; b.appendChild(numLabel);
        let band = document.createElement('div'); band.id = `band-${i}`; band.className = 'stripe-band'; b.appendChild(band);
        b.onclick = () => { vibe(30); const ref = db.ref(`balls/${i}`); ref.once('value').then(snap => { ref.set(snap.val() === false); }); };
        grid.appendChild(b);
    }

    function renderBalls() {
        const data = window.currentActiveData || {};
        const colors = ["", "#ffcc00", "#0055aa", "#cc0000", "#ff66aa", "#663399", "#007744", "#884422", "#000"];
        for (let i = 1; i <= 15; i++) {
            const b = document.getElementById(`btn-${i}`);
            if (!b) continue;
            let show = (currentGameMode == 8) || (currentGameMode == 9 && i <= 9) || (currentGameMode == 10 && i <= 10);
            b.style.display = show ? 'flex' : 'none';
            b.classList.toggle('sunk', data[i] === false);
            if (i <= 8) { 
                const c = colors[i];
                b.style.background = `radial-gradient(circle at 35% 35%, var(--ball-shine) 0%, rgba(255,255,255,0) 50%), radial-gradient(circle at 65% 65%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%), ${c}`;
                document.getElementById(`band-${i}`).style.display='none'; 
            } else {
                const c = colors[i-8];
                const base = (ballStyle === 'dark') ? '#111' : '#fff';
                b.style.background = `radial-gradient(circle at 35% 35%, var(--ball-shine) 0%, rgba(255,255,255,0) 50%), radial-gradient(circle at 65% 65%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%), ${base}`;
                const band = document.getElementById(`band-${i}`);
                band.style.display='block'; band.style.background = c;
            }
        }
    }

    function startMatch() { vibe(80); db.ref('stats').update({ startTime: Date.now() }); db.ref('shotclock/visibility').set(true); db.ref('activePlayer').set(""); resetPool(currentGameMode); }
    function avsluttMatch() { vibe(80); if(confirm("AVSLUTT?")) { db.ref('shotclock/visibility').set(false); db.ref('stats').update({ startTime: 0 }); db.ref('activePlayer').set(null); db.ref('balls').set(null); db.ref('shotclock/cmd').set({ action: 'stop' }); } }
    function shotReset(player) { vibe(40); db.ref('activePlayer').set(player); db.ref('shotclock/cmd').set({ action: 'reset30', ts: Date.now() }); }
    function resetPool(max) { vibe(60); let updates = {}; const limit = (max === 8) ? 15 : max; for (let i = 1; i <= 15; i++) updates[i] = (i <= limit) ? true : null; db.ref('balls').set(updates); db.ref('gameMode').set(max); }
    function addFoul(player) { vibe(60); db.ref(`stats/fouls/${player}`).transaction(c => (c || 0) + 1); }
    function startBreak() { vibe(60); db.ref('shotclock/cmd').set({action:'reset60', ts:Date.now()}); }
    function useExtension() { vibe(60); db.ref('activePlayer').once('value', s => { if (s.val()) db.ref(`stats/extensions/${s.val()}`).transaction(c => (c || 0) + 1); }); db.ref('shotclock/cmd').set({action:'extension', ts:Date.now()}); }
    function sendClock(cmd) { vibe(40); db.ref('shotclock/cmd').set({ action: cmd, ts: Date.now() }); }

    db.ref('activePlayer').on('value', snap => { const p = snap.val(); document.getElementById('btnL').className = `btn-main btn-player ${p === 'left' ? 'active-l' : ''}`; document.getElementById('btnR').className = `btn-main btn-player ${p === 'right' ? 'active-r' : ''}`; });
    db.ref('gameMode').on('value', snap => { currentGameMode = snap.val() || 9; renderBalls(); });
    db.ref('balls').on('value', snap => { window.currentActiveData = snap.val() || {}; renderBalls(); });
</script>
</body>
</html>
