<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KØ-PÅDD Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000;
            --accent: #ffcc00;
            --green: #15803d;
            --red: #991b1b;
            --blue: #0ea5e9;
            --gray: #111;
            --border: #222;
        }

        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box;
            outline: none;
        }

        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: white; 
            font-family: -apple-system, system-ui, sans-serif; 
            overflow: hidden; 
        }
        
        body {
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* Top Bar / Match ID */
        .top-nav {
            background: #000;
            border-bottom: 1px solid var(--border);
            padding: 5px 10px;
        }

        .name-input {
            background: transparent;
            border: none;
            color: var(--accent);
            padding: 12px;
            text-align: center;
            font-size: 14px;
            width: 100%;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Midten - Baller */
        .pool-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000;
        }

        .ball-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            justify-items: center;
            width: 100%;
            padding: 20px;
        }

        .ball-btn {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            border: 2px solid #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        
        .ball-btn:active { transform: scale(0.85); opacity: 0.7; }

        .num-label {
            background: white;
            color: black;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: 900;
            border: 1px solid black;
            z-index: 10;
        }

        .stripe-band {
            position: absolute;
            width: 100%;
            height: 40%;
            z-index: 1;
        }

        .sunk { opacity: 0.05 !important; filter: grayscale(1); transform: scale(0.8); box-shadow: none !important; }

        /* Bottom Controls */
        .bottom-controls {
            background: #000;
            padding-bottom: 10px;
        }

        .mode-row { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .mode-row button {
            background: transparent;
            border: none;
            border-right: 1px solid var(--border);
            padding: 15px 0;
            color: #666;
            font-size: 12px;
            font-weight: 700;
        }

        .mode-row button:last-child { border-right: none; }
        .mode-row button:active { background: #111; color: var(--accent); }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
        }

        button.main-action {
            background: #000;
            border: none;
            color: white;
            padding: 22px 10px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button.main-action:active { background: #111; }

        .player-btn { font-size: 18px !important; color: #fff; }
        .active-l { background: rgba(21, 128, 61, 0.2) !important; color: var(--green) !important; }
        .active-r { background: rgba(14, 165, 233, 0.2) !important; color: var(--blue) !important; }

        .foul-btn { color: #cc5555 !important; font-size: 10px !important; padding: 12px !important; }
        .start-btn { color: var(--green) !important; }
        .stop-btn { color: #cc5555 !important; }
        .extension-btn { grid-column: span 2; color: var(--blue) !important; border-top: 1px solid var(--border) !important; }

    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <input type="text" id="matchIDInput" class="name-input" placeholder="TAP FOR MATCH ID" oninput="updateMatchID()">
    </div>

    <div class="pool-section">
        <div class="ball-grid" id="ball-grid"></div>
        
        <div class="mode-row">
            <button onclick="reputtActiveBalls()">♻️</button>
            <button onclick="toggleBallSet()">🎨</button>
            <button onclick="resetPool(9)">9-BALL</button>
            <button onclick="resetPool(10)">10-BALL</button>
            <button onclick="resetPool(8)">8-BALL</button>
        </div>
    </div>

    <div class="bottom-controls">
        <div class="action-grid">
            <button class="main-action start-btn" onclick="startMatch()">🟢 Start</button>
            <button class="main-action stop-btn" onclick="avsluttMatch()">🔴 Stopp</button>
            
            <button id="btnL" class="main-action player-btn" onclick="shotReset('left')">◀ S1</button>
            <button id="btnR" class="main-action player-btn" onclick="shotReset('right')">S2 ▶</button>
            
            <button class="main-action foul-btn" onclick="addFoul('left')">⚠ FOUL S1</button>
            <button class="main-action foul-btn" onclick="addFoul('right')">⚠ FOUL S2</button>

            <button id="toggleBtn" class="main-action" onclick="sendClock('toggle')">▶ PAUSE</button>
            <button class="main-action" style="color: var(--accent);" onclick="startBreak()">⚡ 60s BREAK</button>
            
            <button class="main-action extension-btn" onclick="useExtension()">+ BRUK EXTENSION</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let lastResetTime = Date.now();
    let ballStyle = 'classic'; 
    let currentGameMode = 9;

    function vibe(ms = 35) { if (navigator.vibrate) navigator.vibrate(ms); }

    async function fetchCueScoreData() {
        let tID = document.getElementById('matchIDInput').value || "79253032"; 
        const proxyUrl = "https://corsproxy.io/?";
        const apiUrl = `https://api.cuescore.com/tournament/?id=${tID}`;
        try {
            const response = await fetch(proxyUrl + apiUrl);
            const data = await response.json();
            const matches = data.matches || [];
            const tableID = "9158140";
            const currentMatch = matches.find(m => m.table_id == tableID || m.table_name == tableID);
            if (currentMatch) {
                db.ref('stats/names').set({ left: currentMatch.player1_name, right: currentMatch.player2_name });
                db.ref('stats/handicaps').set({ left: currentMatch.player1_handicap, right: currentMatch.player2_handicap });
                db.ref('settings/cueScoreMatchID').set(tID);
            }
        } catch (e) { console.error("Feil:", e); }
    }
    
    function updateMatchID() {
        const id = document.getElementById('matchIDInput').value;
        db.ref('settings/cueScoreMatchID').set(id);
        fetchCueScoreData();
    }

    function toggleBallSet() {
        vibe(50);
        ballStyle = (ballStyle === 'classic') ? 'dark' : 'classic';
        db.ref('settings/ballStyle').set(ballStyle);
        renderBalls();
    }

    function reputtActiveBalls() {
        vibe(50);
        db.ref('balls').once('value', snap => {
            let updates = snap.val() || {};
            for (let i in updates) { if (updates[i] === false) updates[i] = true; }
            db.ref('balls').set(updates);
        });
    }

    const grid = document.getElementById('ball-grid');
    for (let i = 1; i <= 15; i++) {
        const b = document.createElement('div');
        b.id = `btn-${i}`; b.className = 'ball-btn';
        let numLabel = document.createElement('div'); numLabel.className = 'num-label'; numLabel.innerText = i; b.appendChild(numLabel);
        let band = document.createElement('div'); band.id = `band-${i}`; band.className = 'stripe-band'; b.appendChild(band);
        b.onclick = () => {
            vibe(25);
            const ref = db.ref(`balls/${i}`);
            ref.once('value').then(snap => {
                const isSinking = snap.val() !== false;
                ref.set(!isSinking);
                if (isSinking) {
                    db.ref('activePlayer').once('value', pSnap => {
                        const p = pSnap.val();
                        if (p) db.ref(`stats/pots/${p}`).transaction(c => (c || 0) + 1);
                    });
                }
            });
        };
        grid.appendChild(b);
    }

    function renderBalls() {
        const data = window.currentActiveData || {};
        const colors = ["", "#ffcc00", "#0055aa", "#cc0000", "#ff66aa", "#663399", "#007744", "#884422", "#000"];
        for (let i = 1; i <= 15; i++) {
            const b = document.getElementById(`btn-${i}`);
            if (!b) continue;
            let shouldShow = (currentGameMode == 8) || (currentGameMode == 9 && i <= 9) || (currentGameMode == 10 && i <= 10);
            b.style.display = shouldShow ? 'flex' : 'none';
            b.classList.toggle('sunk', data[i] === false);
            
            if (i <= 8) { 
                b.style.background = colors[i]; 
                document.getElementById(`band-${i}`).style.display='none';
            } else {
                const band = document.getElementById(`band-${i}`);
                band.style.display='block';
                band.style.background = colors[i-8];
                b.style.background = (ballStyle === 'dark') ? 'black' : 'white';
            }
        }
    }

    function startMatch() {
        vibe(80);
        db.ref('stats').update({ startTime: Date.now() });
        db.ref('shotclock/visibility').set(true);
        db.ref('activePlayer').set("");
        resetPool(currentGameMode);
        fetchCueScoreData(); 
    }

    function avsluttMatch() {
        vibe(80);
        if(confirm("AVSLUTT KAMP?")) {
            db.ref('shotclock/visibility').set(false);
            db.ref('stats').update({ startTime: 0 });
            db.ref('activePlayer').set(null);
            db.ref('balls').set(null);
            db.ref('shotclock/cmd').set({ action: 'stop' });
        }
    }

    function shotReset(player) {
        vibe(40);
        const now = Date.now();
        db.ref('activePlayer').set(player);
        db.ref(`stats/visits/${player}`).transaction(c => (c || 0) + 1);
        db.ref('shotclock/cmd').set({ action: 'reset30', ts: now });
        lastResetTime = now;
    }

    function resetPool(max) {
        vibe(60);
        let updates = {};
        const limit = (max === 8) ? 15 : max;
        for (let i = 1; i <= 15; i++) updates[i] = (i <= limit) ? true : null;
        db.ref('balls').set(updates);
        db.ref('gameMode').set(max);
    }

    function addFoul(player) { vibe(60); db.ref(`stats/fouls/${player}`).transaction(c => (c || 0) + 1); }
    function startBreak() { vibe(60); db.ref('shotclock/cmd').set({action:'reset60', ts:Date.now()}); }
    function useExtension() { vibe(60); db.ref('activePlayer').once('value', s => { if (s.val()) db.ref(`stats/extensions/${s.val()}`).transaction(c => (c || 0) + 1); }); db.ref('shotclock/cmd').set({action:'extension', ts:Date.now()}); }
    function sendClock(cmd) { vibe(40); db.ref('shotclock/cmd').set({ action: cmd, ts: Date.now() }); }

    db.ref('activePlayer').on('value', snap => {
        const p = snap.val();
        document.getElementById('btnL').className = `main-action player-btn ${p === 'left' ? 'active-l' : ''}`;
        document.getElementById('btnR').className = `main-action player-btn ${p === 'right' ? 'active-r' : ''}`;
    });
    db.ref('gameMode').on('value', snap => { currentGameMode = snap.val() || 9; renderBalls(); });
    db.ref('balls').on('value', snap => { window.currentActiveData = snap.val() || {}; renderBalls(); });
    db.ref('settings/ballStyle').on('value', snap => { if(snap.val()){ ballStyle=snap.val(); renderBalls(); }});
</script>
</body>
</html>
