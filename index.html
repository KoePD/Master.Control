<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KØ-PÅDD 3D Max</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000;
            --accent: #ffcc00;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #0284c7;
            --border: #1a1a1a;
            --ball-shine: rgba(255,255,255,0.4);
            --ball-shadow: rgba(0,0,0,0.4);
        }

        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box; 
            outline: none; 
        }

        html, body { 
            height: 100vh; 
            width: 100vw; 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: white; 
            font-family: -apple-system, system-ui, sans-serif; 
            overflow: hidden; 
            position: fixed;
        }
        
        body { 
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; 
            display: flex; 
            flex-direction: column; 
        }

        .container { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            width: 100%; 
        }

        /* GIGANTISK Match ID bar */
        .top-nav { 
            background: #0a0a0a; 
            border-bottom: 2px solid var(--border); 
            flex: 0 0 auto;
        }
        .name-input {
            background: transparent; border: none; color: var(--accent);
            padding: 35px 0; text-align: center; font-size: 24px;
            width: 100%; font-weight: 900; text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* BALL-SEKSJONEN med 3D effekt */
        .pool-section {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            padding-top: 25px;
        }

        .ball-grid {
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px; 
            justify-items: center; 
            width: 100%; 
            padding: 10px;
        }

        .ball-btn {
            width: 30vw;
            height: 30vw; 
            max-width: 135px;
            max-height: 135px;
            border-radius: 50%; 
            border: 2px solid rgba(0,0,0,0.5);
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden; 
            /* 3D EFFEKT: Radial gradient for dybde */
            background: radial-gradient(circle at 30% 30%, var(--ball-shine) 0%, rgba(255,255,255,0) 60%), 
                        radial-gradient(circle at 70% 70%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%),
                        #fff;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.4), 
                        5px 10px 20px rgba(0,0,0,0.6);
        }
        
        .ball-btn:active { transform: scale(0.92); opacity: 0.6; }
        
        .num-label {
            background: white; color: black; width: 32%; height: 32%; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 4.5vw;
            font-weight: 900; border: 1px solid black; z-index: 10;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        
        .stripe-band { 
            position: absolute; 
            width: 100%; 
            height: 40%; 
            z-index: 1;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .sunk { opacity: 0.02 !important; filter: grayscale(1); transform: scale(0.8); box-shadow: none !important; }

        /* MODUS-KNAPPER: Mye større nå */
        .mode-row { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            background: #000; 
            border-top: 3px solid var(--border); 
        }
        
        .mode-row button {
            background: transparent; border: 1px solid var(--border); 
            padding: 40px 0; /* Ekstra høyde */
            color: #fff; font-size: 18px; font-weight: 900;
        }
        .mode-row button:active { background: var(--accent); color: #000; }

        /* BUNN KONTROLLER */
        .action-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            background: var(--border); 
            gap: 2px; 
        }

        .btn-main { 
            background: #000; 
            border: none; 
            color: white; 
            font-weight: 900; 
            text-transform: uppercase;
        }

        .btn-status { padding: 45px 10px; font-size: 20px; }
        .btn-start { color: var(--green); }
        .btn-stop { color: var(--red); }

        .btn-player { padding: 75px 10px; font-size: 34px; letter-spacing: 2px; }
        .active-l { background: var(--green) !important; color: white !important; }
        .active-r { background: var(--blue) !important; color: white !important; }

        .btn-sub { padding: 45px 10px; font-size: 14px; }
        .btn-foul { color: #f87171; background: #0a0000; }
        
        .extension-btn { 
            grid-column: span 2; 
            padding: 50px; 
            color: var(--blue); 
            border-top: 2px solid var(--border);
            font-size: 22px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <input type="text" id="matchIDInput" class="name-input" placeholder="TAP FOR MATCH ID" oninput="updateMatchID()">
    </div>

    <div class="pool-section">
        <div class="ball-grid" id="ball-grid"></div>
    </div>

    <div class="bottom-controls">
        <div class="mode-row">
            <button onclick="reputtActiveBalls()">♻️</button>
            <button onclick="toggleBallSet()">🎨</button>
            <button onclick="resetPool(9)">9</button>
            <button onclick="resetPool(10)">10</button>
            <button onclick="resetPool(8)">8</button>
        </div>

        <div class="action-grid">
            <button class="btn-main btn-status btn-start" onclick="startMatch()">🟢 START MATCH</button>
            <button class="btn-main btn-status btn-stop" onclick="avsluttMatch()">🔴 STOPP</button>
            
            <button id="btnL" class="btn-main btn-player" onclick="shotReset('left')">◀ S1</button>
            <button id="btnR" class="btn-main btn-player" onclick="shotReset('right')">S2 ▶</button>
            
            <button class="btn-main btn-sub btn-foul" onclick="addFoul('left')">⚠ FOUL S1</button>
            <button class="btn-main btn-sub btn-foul" onclick="addFoul('right')">⚠ FOUL S2</button>

            <button id="toggleBtn" class="btn-main btn-sub" onclick="sendClock('toggle')">▶ PAUSE</button>
            <button class="btn-main btn-sub" style="color: var(--accent);" onclick="startBreak()">⚡ 60s BREAK</button>
            
            <button class="btn-main btn-sub extension-btn" onclick="useExtension()">+ BRUK EXTENSION</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let ballStyle = 'classic'; 
    let currentGameMode = 9;

    function vibe(ms = 60) { if (navigator.vibrate) navigator.vibrate(ms); }

    function updateMatchID() {
        db.ref('settings/cueScoreMatchID').set(document.getElementById('matchIDInput').value);
    }

    function toggleBallSet() {
        vibe();
        ballStyle = (ballStyle === 'classic') ? 'dark' : 'classic';
        db.ref('settings/ballStyle').set(ballStyle);
        renderBalls();
    }

    function reputtActiveBalls() {
        vibe();
        db.ref('balls').once('value', snap => {
            let u = snap.val() || {};
            for (let i in u) { if (u[i] === false) u[i] = true; }
            db.ref('balls').set(u);
        });
    }

    const grid = document.getElementById('ball-grid');
    for (let i = 1; i <= 15; i++) {
        const b = document.createElement('div');
        b.id = `btn-${i}`; b.className = 'ball-btn';
        let numLabel = document.createElement('div'); numLabel.className = 'num-label'; numLabel.innerText = i; b.appendChild(numLabel);
        let band = document.createElement('div'); band.id = `band-${i}`; band.className = 'stripe-band'; b.appendChild(band);
        b.onclick = () => {
            vibe(30);
            const ref = db.ref(`balls/${i}`);
            ref.once('value').then(snap => {
                const isSinking = snap.val() !== false;
                ref.set(!isSinking);
            });
        };
        grid.appendChild(b);
    }

    function renderBalls() {
        const data = window.currentActiveData || {};
        const colors = ["", "#ffcc00", "#0055aa", "#cc0000", "#ff66aa", "#663399", "#007744", "#884422", "#000"];
        for (let i = 1; i <= 15; i++) {
            const b = document.getElementById(`btn-${i}`);
            if (!b) continue;
            let show = (currentGameMode == 8) || (currentGameMode == 9 && i <= 9) || (currentGameMode == 10 && i <= 10);
            b.style.display = show ? 'flex' : 'none';
            b.classList.toggle('sunk', data[i] === false);
            
            // Fargelegging med 3D-base
            if (i <= 8) { 
                const c = colors[i];
                b.style.background = `radial-gradient(circle at 30% 30%, var(--ball-shine) 0%, rgba(255,255,255,0) 60%), 
                                     radial-gradient(circle at 70% 70%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%), ${c}`;
                document.getElementById(`band-${i}`).style.display='none'; 
            }
            else {
                const c = colors[i-8];
                const base = (ballStyle === 'dark') ? '#111' : '#fff';
                b.style.background = `radial-gradient(circle at 30% 30%, var(--ball-shine) 0%, rgba(255,255,255,0) 60%), 
                                     radial-gradient(circle at 70% 70%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%), ${base}`;
                const band = document.getElementById(`band-${i}`);
                band.style.display='block';
                band.style.background = c;
            }
        }
    }

    function startMatch() { vibe(100); db.ref('stats').update({ startTime: Date.now() }); db.ref('shotclock/visibility').set(true); db.ref('activePlayer').set(""); resetPool(currentGameMode); }
    function avsluttMatch() { vibe(100); if(confirm("AVSLUTT?")) { db.ref('shotclock/visibility').set(false); db.ref('stats').update({ startTime: 0 }); db.ref('activePlayer').set(null); db.ref('balls').set(null); db.ref('shotclock/cmd').set({ action: 'stop' }); } }
    function shotReset(player) { vibe(40); db.ref('activePlayer').set(player); db.ref('shotclock/cmd').set({ action: 'reset30', ts: Date.now() }); }
    function resetPool(max) { vibe(60); let updates = {}; const limit = (max === 8) ? 15 : max; for (let i = 1; i <= 15; i++) updates[i] = (i <= limit) ? true : null; db.ref('balls').set(updates); db.ref('gameMode').set(max); }
    function addFoul(player) { vibe(60); db.ref(`stats/fouls/${player}`).transaction(c => (c || 0) + 1); }
    function startBreak() { vibe(60); db.ref('shotclock/cmd').set({action:'reset60', ts:Date.now()}); }
    function useExtension() { vibe(60); db.ref('activePlayer').once('value', s => { if (s.val()) db.ref(`stats/extensions/${s.val()}`).transaction(c => (c || 0) + 1); }); db.ref('shotclock/cmd').set({action:'extension', ts:Date.now()}); }
    function sendClock(cmd) { vibe(40); db.ref('shotclock/cmd').set({ action: cmd, ts: Date.now() }); }

    db.ref('activePlayer').on('value', snap => {
        const p = snap.val();
        document.getElementById('btnL').className = `btn-main btn-player ${p === 'left' ? 'active-l' : ''}`;
        document.getElementById('btnR').className = `btn-main btn-player ${p === 'right' ? 'active-r' : ''}`;
    });
    db.ref('gameMode').on('value', snap => { currentGameMode = snap.val() || 9; renderBalls(); });
    db.ref('balls').on('value', snap => { window.currentActiveData = snap.val() || {}; renderBalls(); });
</script>
</body>
</html>
