<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KØ-PÅDD Kontroll Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000; --card: #0d0d0d; --border: #222;
            --accent: #ffcc00; --green: #00FF41; --blue: #00E5FF;
            --red: #FF0000; --ext: #00E5FF;
        }
        * { -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; position: fixed; width: 100%; }
        body { 
            background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom) 8px; 
            box-sizing: border-box; display: flex; flex-direction: column; 
        }
        .container { width: 100%; max-width: 450px; height: 100%; display: flex; flex-direction: column; gap: 6px; margin: 0 auto; }
        .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; }
        .pool-section { flex: 1; min-height: 0; overflow: hidden; } 
        h2 { font-size: 0.6rem; color: var(--accent); text-align: center; margin: 0 0 6px 0; text-transform: uppercase; opacity: 0.6; letter-spacing: 1.5px; }
        
        .name-input { 
            background: #111; border: 1px solid #333; color: white; padding: 10px; 
            border-radius: 8px; text-align: center; font-size: 12px; width: 100%; 
            box-sizing: border-box; outline: none; -webkit-appearance: none;
        }
        #matchIDInput { border: 1px solid var(--accent); color: var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        button { 
            padding: 14px 5px; font-size: 12px; font-weight: 800; border-radius: 8px; 
            border: 1px solid #333; background: #111; color: white; 
            text-transform: uppercase; active { transform: scale(0.96); opacity: 0.8; }
        }
        .player-btn { font-size: 14px; border-width: 2px; }
        .foul-btn { border-color: #331111; color: #ff6666; font-size: 10px; padding: 8px; }
        
        .active-l { border-color: var(--green) !important; color: var(--green) !important; background: rgba(0, 255, 65, 0.1) !important; box-shadow: 0 0 10px rgba(0,255,65,0.2); }
        .active-r { border-color: var(--blue) !important; color: var(--blue) !important; background: rgba(0, 229, 255, 0.1) !important; box-shadow: 0 0 10px rgba(0,229,255,0.2); }

        .ball-scroll-area { flex: 1; overflow-y: auto; padding: 5px 0; }
        .ball-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; justify-items: center; }
        .ball-btn { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #000; position: relative; display: flex; justify-content: center; align-items: center; background: white; }
        .num-label { background: white; color: black; width: 20px; height: 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: 900; border: 1px solid black; z-index: 10; }
        .sunk { opacity: 0.1; filter: grayscale(1); transform: scale(0.85); }
        
        .stripe-band { position: absolute; width: 100%; height: 26px; top: 14.5px; z-index: 1; }
    </style>
</head>
<body>
<div class="container">
    <div class="section">
        <h2>CueScore Table ID</h2>
        <input type="text" id="matchIDInput" class="name-input" placeholder="Match ID (f.eks. 79253032)" oninput="updateMatchID()">
    </div>

    <div class="section pool-section">
        <h2>Pool Control</h2>
        <div class="ball-scroll-area">
            <div class="ball-grid" id="ball-grid"></div>
        </div>
        <div class="grid" style="gap: 4px; grid-template-columns: 1fr 1fr 1fr 1fr 1fr;">
            <button onclick="db.ref('balls').once('value', s => { let u = s.val(); for(let k in u) if(u[k]===false) u[k]=true; db.ref('balls').set(u); })">♻️</button>
            <button onclick="toggleBallSet()">🎨</button>
            <button onclick="resetPool(9)">9</button>
            <button onclick="resetPool(10)">10</button>
            <button onclick="resetPool(8)">8</button>
        </div>
    </div>

    <div class="section">
        <h2>Match & Stats</h2>
        <div class="grid">
            <button style="background:#004d1a; border:none;" onclick="startMatch()">🟢 START</button>
            <button style="background:#4d0000; border:none;" onclick="avsluttMatch()">🔴 STOPP</button>
            
            <button id="btnL" class="player-btn" onclick="shotReset('left')">◀ S1</button>
            <button id="btnR" class="player-btn" onclick="shotReset('right')">S2 ▶</button>
            
            <button class="foul-btn" onclick="addFoul('left')">⚠ FOUL S1</button>
            <button class="foul-btn" onclick="addFoul('right')">⚠ FOUL S2</button>

            <button id="toggleBtn" onclick="sendClock('toggle')">▶ START/PAUSE</button>
            <button style="border-color: var(--accent); color: var(--accent);" onclick="startBreak()">⚡ 60s BREAK</button>
            
            <button style="grid-column: span 2; color: var(--ext); border-color: var(--ext);" onclick="useExtension()">+ BRUK EXTENSION</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let lastResetTime = Date.now();
    let ballStyle = 'classic'; 
    let currentGameMode = 9;

    function vibe(ms = 40) { if (navigator.vibrate) navigator.vibrate(ms); }

    async function fetchCueScoreData() {
        let tID = document.getElementById('matchIDInput').value || "79253032"; 
        const proxyUrl = "https://corsproxy.io/?";
        const apiUrl = `https://api.cuescore.com/tournament/?id=${tID}`;
        try {
            const response = await fetch(proxyUrl + apiUrl);
            const data = await response.json();
            const matches = data.matches || [];
            const tableID = "9158140";
            const currentMatch = matches.find(m => m.table_id == tableID || m.table_name == tableID);
            if (currentMatch) {
                db.ref('stats/names').set({ left: currentMatch.player1_name, right: currentMatch.player2_name });
                db.ref('stats/handicaps').set({ left: currentMatch.player1_handicap, right: currentMatch.player2_handicap });
                db.ref('settings/cueScoreMatchID').set(tID);
            }
        } catch (e) { console.error("Feil:", e); }
    }
    
    function updateMatchID() {
        db.ref('settings/cueScoreMatchID').set(document.getElementById('matchIDInput').value);
        fetchCueScoreData();
    }

    function toggleBallSet() {
        vibe(60);
        ballStyle = (ballStyle === 'classic') ? 'dark' : 'classic';
        db.ref('settings/ballStyle').set(ballStyle);
        renderBalls();
    }

    const grid = document.getElementById('ball-grid');
    for (let i = 1; i <= 15; i++) {
        const b = document.createElement('div');
        b.id = `btn-${i}`; b.className = 'ball-btn';
        let numLabel = document.createElement('div'); numLabel.className = 'num-label'; numLabel.innerText = i; b.appendChild(numLabel);
        let band = document.createElement('div'); band.id = `band-${i}`; band.className = 'stripe-band'; b.appendChild(band);
        b.onclick = () => {
            vibe(30);
            const ref = db.ref(`balls/${i}`);
            ref.once('value').then(snap => {
                const isSinking = snap.val() !== false;
                ref.set(!isSinking);
                if (isSinking) {
                    db.ref('activePlayer').once('value', pSnap => {
                        const p = pSnap.val();
                        if (p) db.ref(`stats/pots/${p}`).transaction(c => (c || 0) + 1);
                    });
                }
            });
        };
        grid.appendChild(b);
    }

    function renderBalls() {
        const data = window.currentActiveData || {};
        const colors = ["", "#ffcc00", "#0055aa", "#cc0000", "#ff66aa", "#663399", "#007744", "#884422", "#000"];
        for (let i = 1; i <= 15; i++) {
            const b = document.getElementById(`btn-${i}`);
            if (!b) continue;
            let shouldShow = (currentGameMode == 8) || (currentGameMode == 9 && i <= 9) || (currentGameMode == 10 && i <= 10);
            b.style.display = shouldShow ? 'flex' : 'none';
            b.classList.toggle('sunk', data[i] === false);
            if (i <= 8) { b.style.background = colors[i]; document.getElementById(`band-${i}`).style.display='none'; } 
            else {
                document.getElementById(`band-${i}`).style.display='block';
                document.getElementById(`band-${i}`).style.background = colors[i-8];
                b.style.background = (ballStyle === 'dark') ? 'black' : 'white';
            }
        }
    }

    function startMatch() {
        vibe(100);
        db.ref('stats').update({ startTime: Date.now() });
        db.ref('shotclock/visibility').set(true); // Vis shotclock
        db.ref('activePlayer').set("");
        resetPool(currentGameMode);
        fetchCueScoreData(); 
    }

    function avsluttMatch() {
        vibe(100);
        if(confirm("Avslutte kamp?")) {
            db.ref('shotclock/visibility').set(false); // Skjul shotclock
            db.ref('stats').update({ startTime: 0 });
            db.ref('activePlayer').set(null);
            db.ref('balls').set(null);
            db.ref('shotclock/cmd').set({ action: 'stop' });
        }
    }

    function shotReset(player) {
        vibe(50);
        const now = Date.now();
        db.ref('activePlayer').set(player);
        db.ref(`stats/visits/${player}`).transaction(c => (c || 0) + 1);
        db.ref('shotclock/cmd').set({ action: 'reset30', ts: now });
        lastResetTime = now;
    }

    function resetPool(max) {
        let updates = {};
        const limit = (max === 8) ? 15 : max;
        for (let i = 1; i <= 15; i++) updates[i] = (i <= limit) ? true : null;
        db.ref('balls').set(updates);
        db.ref('gameMode').set(max);
    }

    function addFoul(player) { vibe(80); db.ref(`stats/fouls/${player}`).transaction(c => (c || 0) + 1); }
    function startBreak() { vibe(60); db.ref('shotclock/cmd').set({action:'reset60', ts:Date.now()}); }
    function useExtension() { vibe(80); db.ref('activePlayer').once('value', s => { if (s.val()) db.ref(`stats/extensions/${s.val()}`).transaction(c => (c || 0) + 1); }); db.ref('shotclock/cmd').set({action:'extension', ts:Date.now()}); }
    function sendClock(cmd) { vibe(40); db.ref('shotclock/cmd').set({ action: cmd, ts: Date.now() }); }

    db.ref('activePlayer').on('value', snap => {
        const p = snap.val();
        document.getElementById('btnL').classList.toggle('active-l', p === 'left');
        document.getElementById('btnR').classList.toggle('active-r', p === 'right');
    });
    db.ref('gameMode').on('value', snap => { currentGameMode = snap.val() || 9; renderBalls(); });
    db.ref('balls').on('value', snap => { window.currentActiveData = snap.val() || {}; renderBalls(); });
    db.ref('settings/ballStyle').on('value', snap => { if(snap.val()){ ballStyle=snap.val(); renderBalls(); }});
</script>
</body>
</html>
