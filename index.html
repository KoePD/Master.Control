<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KØ-PÅDD Kontrollpanel Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000; --card: #000; --border: #1a1a1a;
            --accent: #ffcc00; --green: #00FF41; --blue: #00E5FF;
            --red: #ff4444; --ext: #00E5FF;
        }
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        
        body {
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            gap: 0; /* Fjernet gap mellom seksjoner for sømløs look */
        }

        .section {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .pool-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
            padding: 10px 0; /* Mer plass til kulene */
        }

        h2 { font-size: 0.6rem; color: var(--accent); text-align: center; margin: 0 0 10px 0; text-transform: uppercase; opacity: 0.5; letter-spacing: 2px; }

        .ball-scroll-area { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 100%;
        }

        .ball-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            justify-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .ball-btn {
            width: 85px; /* Enda større baller */
            height: 85px;
            border-radius: 50%;
            border: 2px solid #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        
        .ball-btn:active { transform: scale(0.9); opacity: 0.6; }

        .num-label {
            background: white;
            color: black;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: 900;
            border: 1px solid black;
            z-index: 10;
        }

        .stripe-band {
            position: absolute;
            width: 100%;
            height: 40%;
            z-index: 1;
        }

        .sunk { opacity: 0.03 !important; filter: grayscale(1); transform: scale(0.8); box-shadow: none !important; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 0 4px; }
        
        button {
            padding: 20px 5px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 0; /* Fjerner radius for "kant-til-kant" look */
            border: 1px solid #111;
            background: #080808;
            color: white;
            text-transform: uppercase;
        }

        button:active { background: #1a1a1a; }

        /* Spesialknapper nederst får litt radius for å skille seg ut */
        .match-controls button { border-radius: 8px; margin: 2px 0; }

        .player-btn { font-size: 20px; padding: 25px 5px; }
        .foul-btn { color: #cc5555; font-size: 11px; padding: 15px 0; }
        
        .active-l { border-color: var(--green) !important; color: var(--green) !important; background: rgba(0, 255, 65, 0.05) !important; }
        .active-r { border-color: var(--blue) !important; color: var(--blue) !important; background: rgba(0, 229, 255, 0.05) !important; }

        .name-input {
            background: #000; border: 1px solid #222; color: white; padding: 18px;
            border-radius: 0; text-align: center; font-size: 16px; width: 100%; outline: none;
        }
        #matchIDInput { border: 1px solid #222; color: var(--accent); }

        .mode-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 5px; background: #050505; }
        .mode-row button { padding: 15px 0; font-size: 11px; background: #000; border: 1px solid #111; }
    </style>
</head>
<body>
<div class="container">
    <div class="section" style="padding:0;">
        <input type="text" id="matchIDInput" class="name-input" placeholder="Lim inn Match ID" oninput="updateMatchID()">
    </div>

    <div class="section pool-section">
        <div class="ball-scroll-area">
            <div class="ball-grid" id="ball-grid"></div>
        </div>
        <div class="mode-row">
            <button onclick="reputtActiveBalls()">♻️</button>
            <button onclick="toggleBallSet()">🎨</button>
            <button onclick="resetPool(9)">9</button>
            <button onclick="resetPool(10)">10</button>
            <button onclick="resetPool(8)">8</button>
        </div>
    </div>

    <div class="section match-controls" style="border-bottom:none; padding-bottom: 20px;">
        <div class="grid">
            <button style="background:#0a3d1a; border:none;" onclick="startMatch()">🟢 START</button>
            <button style="background:#3d0a0a; border:none;" onclick="avsluttMatch()">🔴 STOPP</button>
            
            <button id="btnL" class="player-btn" onclick="shotReset('left')">◀ S1</button>
            <button id="btnR" class="player-btn" onclick="shotReset('right')">S2 ▶</button>
            
            <button class="foul-btn" onclick="addFoul('left')">⚠ FOUL S1</button>
            <button class="foul-btn" onclick="addFoul('right')">⚠ FOUL S2</button>

            <button id="toggleBtn" onclick="sendClock('toggle')">▶ PAUSE</button>
            <button style="border-color: #333; color: var(--accent);" onclick="startBreak()">⚡ 60s BREAK</button>
            
            <button style="grid-column: span 2; color: var(--ext); border: 1px solid #00444a;" onclick="useExtension()">+ BRUK EXTENSION</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let lastResetTime = Date.now();
    let ballStyle = 'classic'; 
    let currentGameMode = 9;

    function vibe(ms = 40) { if (navigator.vibrate) navigator.vibrate(ms); }

    async function fetchCueScoreData() {
        let tID = document.getElementById('matchIDInput').value || "79253032"; 
        const proxyUrl = "https://corsproxy.io/?";
        const apiUrl = `https://api.cuescore.com/tournament/?id=${tID}`;
        try {
            const response = await fetch(proxyUrl + apiUrl);
            const data = await response.json();
            const matches = data.matches || [];
            const tableID = "9158140";
            const currentMatch = matches.find(m => m.table_id == tableID || m.table_name == tableID);
            if (currentMatch) {
                db.ref('stats/names').set({ left: currentMatch.player1_name, right: currentMatch.player2_name });
                db.ref('stats/handicaps').set({ left: currentMatch.player1_handicap, right: currentMatch.player2_handicap });
                db.ref('settings/cueScoreMatchID').set(tID);
            }
        } catch (e) { console.error("Feil:", e); }
    }
    
    function updateMatchID() {
        const id = document.getElementById('matchIDInput').value;
        db.ref('settings/cueScoreMatchID').set(id);
        fetchCueScoreData();
    }

    function toggleBallSet() {
        vibe(60);
        ballStyle = (ballStyle === 'classic') ? 'dark' : 'classic';
        db.ref('settings/ballStyle').set(ballStyle);
        renderBalls();
    }

    function reputtActiveBalls() {
        vibe(60);
        db.ref('balls').once('value', snap => {
            let updates = snap.val() || {};
            for (let i in updates) { if (updates[i] === false) updates[i] = true; }
            db.ref('balls').set(updates);
        });
    }

    const grid = document.getElementById('ball-grid');
    for (let i = 1; i <= 15; i++) {
        const b = document.createElement('div');
        b.id = `btn-${i}`; b.className = 'ball-btn';
        let numLabel = document.createElement('div'); numLabel.className = 'num-label'; numLabel.innerText = i; b.appendChild(numLabel);
        let band = document.createElement('div'); band.id = `band-${i}`; band.className = 'stripe-band'; b.appendChild(band);
        b.onclick = () => {
            vibe(30);
            const ref = db.ref(`balls/${i}`);
            ref.once('value').then(snap => {
                const isSinking = snap.val() !== false;
                ref.set(!isSinking);
                if (isSinking) {
                    db.ref('activePlayer').once('value', pSnap => {
                        const p = pSnap.val();
                        if (p) db.ref(`stats/pots/${p}`).transaction(c => (c || 0) + 1);
                    });
                }
            });
        };
        grid.appendChild(b);
    }

    function renderBalls() {
        const data = window.currentActiveData || {};
        const colors = ["", "#ffcc00", "#0055aa", "#cc0000", "#ff66aa", "#663399", "#007744", "#884422", "#000"];
        for (let i = 1; i <= 15; i++) {
            const b = document.getElementById(`btn-${i}`);
            if (!b) continue;
            let shouldShow = (currentGameMode == 8) || (currentGameMode == 9 && i <= 9) || (currentGameMode == 10 && i <= 10);
            b.style.display = shouldShow ? 'flex' : 'none';
            b.classList.toggle('sunk', data[i] === false);
            
            if (i <= 8) { 
                b.style.background = colors[i]; 
                document.getElementById(`band-${i}`).style.display='none';
            } else {
                const band = document.getElementById(`band-${i}`);
                band.style.display='block';
                band.style.background = colors[i-8];
                b.style.background = (ballStyle === 'dark') ? 'black' : 'white';
            }
        }
    }

    function startMatch() {
        vibe(100);
        db.ref('stats').update({ startTime: Date.now() });
        db.ref('shotclock/visibility').set(true);
        db.ref('activePlayer').set("");
        resetPool(currentGameMode);
        fetchCueScoreData(); 
    }

    function avsluttMatch() {
        vibe(100);
        if(confirm("Avslutte kamp?")) {
            db.ref('shotclock/visibility').set(false);
            db.ref('stats').update({ startTime: 0 });
            db.ref('activePlayer').set(null);
            db.ref('balls').set(null);
            db.ref('shotclock/cmd').set({ action: 'stop' });
        }
    }

    function shotReset(player) {
        vibe(50);
        const now = Date.now();
        db.ref('activePlayer').set(player);
        db.ref(`stats/visits/${player}`).transaction(c => (c || 0) + 1);
        db.ref('shotclock/cmd').set({ action: 'reset30', ts: now });
        lastResetTime = now;
    }

    function resetPool(max) {
        let updates = {};
        const limit = (max === 8) ? 15 : max;
        for (let i = 1; i <= 15; i++) updates[i] = (i <= limit) ? true : null;
        db.ref('balls').set(updates);
        db.ref('gameMode').set(max);
    }

    function addFoul(player) { vibe(80); db.ref(`stats/fouls/${player}`).transaction(c => (c || 0) + 1); }
    function startBreak() { vibe(60); db.ref('shotclock/cmd').set({action:'reset60', ts:Date.now()}); }
    function useExtension() { vibe(80); db.ref('activePlayer').once('value', s => { if (s.val()) db.ref(`stats/extensions/${s.val()}`).transaction(c => (c || 0) + 1); }); db.ref('shotclock/cmd').set({action:'extension', ts:Date.now()}); }
    function sendClock(cmd) { vibe(40); db.ref('shotclock/cmd').set({ action: cmd, ts: Date.now() }); }

    db.ref('activePlayer').on('value', snap => {
        const p = snap.val();
        document.getElementById('btnL').classList.toggle('active-l', p === 'left');
        document.getElementById('btnR').classList.toggle('active-r', p === 'right');
    });
    db.ref('gameMode').on('value', snap => { currentGameMode = snap.val() || 9; renderBalls(); });
    db.ref('balls').on('value', snap => { window.currentActiveData = snap.val() || {}; renderBalls(); });
    db.ref('settings/ballStyle').on('value', snap => { if(snap.val()){ ballStyle=snap.val(); renderBalls(); }});
</script>
</body>
</html>
