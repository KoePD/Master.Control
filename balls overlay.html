<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { 
            background: transparent; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            height: 100vh; 
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* DIN ORIGINALE CONTAINER */
        .ball-container {
            display: flex;
            justify-content: center;
            align-items: center; 
            gap: 10px; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 0 0 25px 25px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.25); 
            min-width: 520px; 
            height: 60px; 
            padding: 0 15px; 
            border-top: none;
            overflow: visible !important; 
        }

        /* ==========================================================================
           HANDICAP-BOKSER (Integrert og klistret til kulene)
           ========================================================================== */
        .hcp-box {
            background: #083c2c; /* Mørkegrønn */
            height: 48px; 
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Open Sans', Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .hcp-value {
            color: #00af79; /* Lysegrønt tall */
            font-weight: 900;
            margin-left: 6px;
            font-size: 18px;
        }

        /* Speilvendt form på venstre side */
        #hcp-A {
            border-radius: 24px 0 0 24px !important;
            margin-right: 5px; 
        }

        /* Speilvendt form på høyre side */
        #hcp-B {
            border-radius: 0 24px 24px 0 !important;
            margin-left: 5px; 
        }

        /* ==========================================================================
           DINE ORIGINALE KULER (100% URØRT)
           ========================================================================== */
        .ball {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            transition: background-color 0.3s ease;
        }

        .ball-overlay-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                inset -3px -3px 6px rgba(0,0,0,0.4), 
                inset 2px 2px 5px rgba(255,255,255,0.2); 
            border: 1px solid rgba(0,0,0,0.15); 
            box-sizing: border-box;
        }

        .num-label {
            background: white;
            color: black;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 900;
            z-index: 5;
            border: 1.5px solid #000;
        }

        .sunk {
            visibility: hidden; 
        }

        .ball.striped.dark-set { background-color: #000000 !important; }
        .ball.striped.classic-set { background-color: #ffffff !important; }

        .stripe-band { 
            position: absolute; 
            width: 100%; 
            height: 32px; 
            top: 8px; 
            z-index: 1;
        }

        .f-1, .b9 { background-color: #ffcc00; } 
        .f-2, .b10 { background-color: #0055aa; }
        .f-3, .b11 { background-color: #cc0000; } 
        .f-4, .b12 { background-color: #ff66aa; }
        .f-5, .b13 { background-color: #663399; } 
        .f-6, .b14 { background-color: #007744; }
        .f-7, .b15 { background-color: #884422; } 
        .f-8 { background-color: black; }

        /* Gjemmer CueScore-skrapet vi bruker til å hente data i bakgrunnen */
        #cuescore-bridge { 
            display: none !important; 
        }
    </style>
</head>
<body>

    <div class="ball-container" id="display"></div>

    <iframe id="cuescore-bridge" src="https://cuescore.com/scoreboard/overlay/custom/?tableId=9158140"></iframe>

    <script>
        const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentBallStyle = 'dark'; 
        let lastBallData = null;
        
        let hcpA = "-";
        let hcpB = "-";

        function renderOverlay(data) {
            const display = document.getElementById('display');
            if (!data || Object.keys(data).length === 0) {
                display.style.display = 'none'; 
                return;
            } else {
                display.style.display = 'flex';
            }

            display.innerHTML = '';

            // 1. Venstre handicap-boks
            const boxA = document.createElement('div');
            boxA.className = 'hcp-box';
            boxA.id = 'hcp-A';
            boxA.innerHTML = `Handicap: <span class="hcp-value">${hcpA}</span>`;
            display.appendChild(boxA);

            // 2. Kulerads-generering
            for (let i = 1; i <= 15; i++) {
                if (data[i] === undefined) continue;

                const b = document.createElement('div');
                b.className = `ball ${data[i] ? '' : 'sunk'}`;
                
                let cIdx = i > 8 ? i - 8 : i;
                
                if (i > 8) {
                    b.classList.add('striped');
                    b.classList.add(currentBallStyle === 'dark' ? 'dark-set' : 'classic-set');
                    
                    let band = document.createElement('div');
                    band.className = `stripe-band f-${cIdx}`;
                    b.appendChild(band);
                } else {
                    b.classList.add(`f-${cIdx}`);
                }

                let num = document.createElement('div');
                num.className = 'num-label';
                num.innerText = i;
                b.appendChild(num);

                let overlay = document.createElement('div');
                overlay.className = 'ball-overlay-3d';
                b.appendChild(overlay);
                
                display.appendChild(b);
            }

            // 3. Høyre handicap-boks
            const boxB = document.createElement('div');
            boxB.className = 'hcp-box';
            boxB.id = 'hcp-B';
            boxB.innerHTML = `Handicap: <span class="hcp-value">${hcpB}</span>`;
            display.appendChild(boxB);
        }

        // ==========================================================================
        // AUTOMATISK UTKLYPP FRA DIN CUESCORE-MAL (Hvert 3. sekund)
        // ==========================================================================
        function fetchHandicapsFromBridge() {
            const iframe = document.getElementById('cuescore-bridge');
            if (iframe && iframe.contentWindow) {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // Sjekker klassene (.handicap) direkte fra din egne HTML-mal i bakgrunnen
                    const nameA = doc.querySelector('#namePlayerA .handicap');
                    const nameB = doc.querySelector('#namePlayerB .handicap');

                    let changed = false;

                    if (nameA) {
                        // Tar f.eks "(2)" og gjør det til "2"
                        let cleanA = nameA.innerText.replace(/[\(\)]/g, '').trim();
                        if (hcpA !== cleanA) { hcpA = cleanA; changed = true; }
                    }
                    if (nameB) {
                        // Tar f.eks "(3)" og gjør det til "3"
                        let cleanB = nameB.innerText.replace(/[\(\)]/g, '').trim();
                        if (hcpB !== cleanB) { hcpB = cleanB; changed = true; }
                    }

                    // Oppdaterer kun boksene hvis tallene faktisk har endret seg på CueScore
                    if (changed && lastBallData) {
                        renderOverlay(lastBallData);
                    }
                } catch (e) {
                    console.log("Henter oppdaterte hcp-tall fra malen...");
                }
            }
        }

        // Sjekker etter endringer hvert 3. sekund
        setInterval(fetchHandicapsFromBridge, 3000);

        // FIREBASE-STRØM (Dine originale)
        db.ref('settings/ballStyle').on('value', snap => {
            currentBallStyle = snap.val() || 'dark';
            if (lastBallData) { renderOverlay(lastBallData); }
        });

        db.ref('balls').on('value', snap => {
            lastBallData = snap.val();
            renderOverlay(lastBallData);
            setTimeout(fetchHandicapsFromBridge, 400);
        });
    </script>
</body>
</html>
