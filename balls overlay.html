<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { 
            background: transparent; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            height: 100vh; 
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin-top: 25px;
        }

        /* CONTAINER FOR HCP-VINGE */
        .side-wrapper {
            display: flex;
            align-items: center;
            transform: translateY(-18px); /* Samme høydejustering som vingene */
        }

        /* KULERAD-CONTAINER */
        .ball-container {
            display: flex;
            justify-content: center;
            align-items: center; 
            gap: 10px; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 0 0 25px 25px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.25);
            min-width: 520px; 
            height: 60px; 
            padding: 0 15px; 
            border-top: none;
            z-index: 2;
        }

        /* HANDICAP-VINGENE */
        .hcp-wing {
            background: #083c2c; 
            height: 24px; 
            display: flex;
            align-items: center;
            padding: 0 18px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Open Sans', Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1;
            transition: all 0.3s ease;
        }

        .hcp-wing.hidden {
            display: none !important;
        }

        .hcp-value {
            color: #00af79; 
            font-weight: 900;
            margin-left: 6px;
            font-size: 18px;
        }

        #hcp-A {
            border-radius: 10px 0px 0px 10px !important; 
            margin-right: -2px; 
        }

        #hcp-B {
            border-radius: 0px 10px 10px 0px !important; 
            margin-left: -2px; 
        }

        /* KULE-STILER */
        .ball {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            transition: background-color 0.3s ease;
        }

        .ball-overlay-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                inset -3px -3px 6px rgba(0,0,0,0.4), 
                inset 2px 2px 5px rgba(255,255,255,0.2); 
            border: 1px solid rgba(0,0,0,0.15); 
            box-sizing: border-box;
        }

        .num-label {
            background: white;
            color: black;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 900;
            z-index: 5;
            border: 1.5px solid #000;
        }

        .sunk {
            visibility: hidden; 
        }

        .ball.striped.dark-set { background-color: #000000 !important; }
        .ball.striped.classic-set { background-color: #ffffff !important; }

        .stripe-band { 
            position: absolute; 
            width: 100%; 
            height: 32px; 
            top: 8px; 
            z-index: 1;
        }

        .f-1, .b9 { background-color: #ffcc00; } 
        .f-2, .b10 { background-color: #0055aa; }
        .f-3, .b11 { background-color: #cc0000; } 
        .f-4, .b12 { background-color: #ff66aa; }
        .f-5, .b13 { background-color: #663399; } 
        .f-6, .b14 { background-color: #007744; }
        .f-7, .b15 { background-color: #884422; } 
        .f-8 { background-color: black; }
    </style>
</head>
<body>

    <div class="main-wrapper" id="main-frame"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentBallStyle = 'dark'; 
        let lastBallData = null;
        
        let hcpA = "-";
        let hcpB = "-";
        let showHcp = true; 

        function renderOverlay(data) {
            const mainFrame = document.getElementById('main-frame');
            if (!data || Object.keys(data).length === 0) {
                mainFrame.style.display = 'none'; 
                return;
            } else {
                mainFrame.style.display = 'flex';
            }

            mainFrame.innerHTML = '';

            // VENSTRE SIDE (HCP Vinge A)
            const sideA = document.createElement('div');
            sideA.className = 'side-wrapper';

            const boxA = document.createElement('div');
            boxA.className = `hcp-wing ${showHcp ? '' : 'hidden'}`;
            boxA.id = 'hcp-A';
            boxA.innerHTML = `Handicap: <span class="hcp-value">${hcpA}</span>`;
            sideA.appendChild(boxA);
            
            mainFrame.appendChild(sideA);

            // MIDTEN (Kulene)
            const ballContainer = document.createElement('div');
            ballContainer.className = 'ball-container';

            for (let i = 1; i <= 15; i++) {
                if (data[i] === undefined) continue;

                const b = document.createElement('div');
                b.className = `ball ${data[i] ? '' : 'sunk'}`;
                
                let cIdx = i > 8 ? i - 8 : i;
                
                if (i > 8) {
                    b.classList.add('striped');
                    b.classList.add(currentBallStyle === 'dark' ? 'dark-set' : 'classic-set');
                    
                    let band = document.createElement('div');
                    band.className = `stripe-band f-${cIdx}`;
                    b.appendChild(band);
                } else {
                    b.classList.add(`f-${cIdx}`);
                }

                let num = document.createElement('div');
                num.className = 'num-label';
                num.innerText = i;
                b.appendChild(num);

                let overlay = document.createElement('div');
                overlay.className = 'ball-overlay-3d';
                b.appendChild(overlay);
                
                ballContainer.appendChild(b);
            }
            
            mainFrame.appendChild(ballContainer);

            // HØYRE SIDE (HCP Vinge B)
            const sideB = document.createElement('div');
            sideB.className = 'side-wrapper';

            const boxB = document.createElement('div');
            boxB.className = `hcp-wing ${showHcp ? '' : 'hidden'}`;
            boxB.id = 'hcp-B';
            boxB.innerHTML = `Handicap: <span class="hcp-value">${hcpB}</span>`;
            sideB.appendChild(boxB);
            
            mainFrame.appendChild(sideB);
        }

        // Lytter på stil-endringer
        db.ref('settings/ballStyle').on('value', snap => {
            currentBallStyle = snap.val() || 'dark';
            if (lastBallData) { renderOverlay(lastBallData); }
        });

        // Lytt på handicap-verdier og synlighet fra Firebase
        db.ref('stats/handicap').on('value', snap => {
            const hcpData = snap.val() || {};
            hcpA = hcpData.left !== undefined ? hcpData.left : "-";
            hcpB = hcpData.right !== undefined ? hcpData.right : "-";
            showHcp = hcpData.visible !== false;
            if (lastBallData) { renderOverlay(lastBallData); }
        });

        // Lytt på kule-endringer
        db.ref('balls').on('value', snap => {
            lastBallData = snap.val();
            renderOverlay(lastBallData);
        });
    </script>
</body>
</html>
