<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { 
            background: transparent; 
            margin: 0; 
            display: flex; 
            flex-direction: column; /* Legger kontrollpanelet UNDER kulene */
            align-items: center; 
            justify-content: flex-start;
            height: 100vh; 
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 1. OBS-TRYGG KONTROLLPANEL (Skjult på stream, dukker opp i Interager-vinduet) */
        .hcp-control {
            margin-top: 15px;
            background: #111111;
            border: 2px solid #333333;
            padding: 12px;
            border-radius: 8px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0; /* SKJULER PANELET FRA STREAMEN DIN */
            pointer-events: auto;
        }

        /* Vises KUN når du åpner "Interager" i OBS */
        body:hover .hcp-control, 
        body:focus-within .hcp-control,
        .hcp-control:focus-within {
            opacity: 1 !important;
        }

        .hcp-control label { color: #ffffff; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        
        /* STIL FOR DE NYE MANUELLE TEKSTBOKSENE */
        .hcp-control input[type="text"] { 
            background: #252525; 
            color: #ffffff; 
            border: 1px solid #555555; 
            padding: 4px; 
            border-radius: 4px; 
            font-size: 12px; 
            width: 45px; 
            text-align: center;
        }
        
        .hcp-control .row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .hcp-control-toggle { border-bottom: 1px solid #333333; padding-bottom: 6px; margin-bottom: 4px; }

        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin-top: 25px;
        }

        /* DIN ORIGINALE KULERAD-CONTAINER */
        .ball-container {
            display: flex;
            justify-content: center;
            align-items: center; 
            gap: 10px; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 0 0 25px 25px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.25);
            min-width: 520px; 
            height: 60px; 
            padding: 0 15px; 
            border-top: none;
            z-index: 2;
        }

        /* HANDICAP-VINGENE */
        .hcp-wing {
            background: #083c2c; 
            height: 24px; 
            display: flex;
            align-items: center;
            padding: 0 18px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Open Sans', Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1;
        }

        .hcp-wing.hidden {
            display: none !important;
        }

        .hcp-value {
            color: #00af79; 
            font-weight: 900;
            margin-left: 6px;
            font-size: 18px;
        }

        /* 2. SPEILVENDTE HJØRNER SOM FLUKTER MED TOPPEN */
        #hcp-A {
            border-radius: 10px 0px 0px 10px !important; 
            margin-right: -2px; 
            transform: translateY(-18px) !important; 
        }

        #hcp-B {
            border-radius: 0px 10px 10px 0px !important; 
            margin-left: -2px; 
            transform: translateY(-18px) !important; 
        }

        /* DINE ORIGINALE KULE-STILER */
        .ball {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            transition: background-color 0.3s ease;
        }

        .ball-overlay-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                inset -3px -3px 6px rgba(0,0,0,0.4), 
                inset 2px 2px 5px rgba(255,255,255,0.2); 
            border: 1px solid rgba(0,0,0,0.15); 
            box-sizing: border-box;
        }

        .num-label {
            background: white;
            color: black;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 900;
            z-index: 5;
            border: 1.5px solid #000;
        }

        .sunk {
            visibility: hidden; 
        }

        .ball.striped.dark-set { background-color: #000000 !important; }
        .ball.striped.classic-set { background-color: #ffffff !important; }

        .stripe-band { 
            position: absolute; 
            width: 100%; 
            height: 32px; 
            top: 8px; 
            z-index: 1;
        }

        .f-1, .b9 { background-color: #ffcc00; } 
        .f-2, .b10 { background-color: #0055aa; }
        .f-3, .b11 { background-color: #cc0000; } 
        .f-4, .b12 { background-color: #ff66aa; }
        .f-5, .b13 { background-color: #663399; } 
        .f-6, .b14 { background-color: #007744; }
        .f-7, .b15 { background-color: #884422; } 
        .f-8 { background-color: black; }
    </style>
</head>
<body>

    <div class="main-wrapper" id="main-frame"></div>

    <div class="hcp-control">
        <div class="hcp-control-toggle">
            <label><input type="checkbox" id="toggle-hcp" onchange="updateManualHcp()"> Vis Handicap</label>
        </div>
        <div class="row">
            <label>Spiller A:</label>
            <input type="text" id="input-hcpA" oninput="updateManualHcp()" placeholder="2">
        </div>
        <div class="row">
            <label>Spiller B:</label>
            <input type="text" id="input-hcpB" oninput="updateManualHcp()" placeholder="3">
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentBallStyle = 'dark'; 
        let lastBallData = null;
        
        // Henter lagrede verdier fra OBS-minnet
        let hcpA = localStorage.getItem('hcp_val_A') || "2";
        let hcpB = localStorage.getItem('hcp_val_B') || "3";
        let showHcp = localStorage.getItem('hcp_show') !== "false"; 

        document.getElementById('input-hcpA').value = hcpA;
        document.getElementById('input-hcpB').value = hcpB;
        document.getElementById('toggle-hcp').checked = showHcp;

        function updateManualHcp() {
            hcpA = document.getElementById('input-hcpA').value;
            hcpB = document.getElementById('input-hcpB').value;
            showHcp = document.getElementById('toggle-hcp').checked;
            
            localStorage.setItem('hcp_val_A', hcpA);
            localStorage.setItem('hcp_val_B', hcpB);
            localStorage.setItem('hcp_show', showHcp);
            
            if (lastBallData) {
                renderOverlay(lastBallData);
            }
        }

        function renderOverlay(data) {
            const mainFrame = document.getElementById('main-frame');
            if (!data || Object.keys(data).length === 0) {
                mainFrame.style.display = 'none'; 
                return;
            } else {
                mainFrame.style.display = 'flex';
            }

            mainFrame.innerHTML = '';

            // Venstre boks
            const boxA = document.createElement('div');
            boxA.className = `hcp-wing ${showHcp ? '' : 'hidden'}`;
            boxA.id = 'hcp-A';
            boxA.innerHTML = `Handicap: <span class="hcp-value">${hcpA}</span>`;
            mainFrame.appendChild(boxA);

            // Midten (Kulene)
            const ballContainer = document.createElement('div');
            ballContainer.className = 'ball-container';

            for (let i = 1; i <= 15; i++) {
                if (data[i] === undefined) continue;

                const b = document.createElement('div');
                b.className = `ball ${data[i] ? '' : 'sunk'}`;
                
                let cIdx = i > 8 ? i - 8 : i;
                
                if (i > 8) {
                    b.classList.add('striped');
                    b.classList.add(currentBallStyle === 'dark' ? 'dark-set' : 'classic-set');
                    
                    let band = document.createElement('div');
                    band.className = `stripe-band f-${cIdx}`;
                    b.appendChild(band);
                } else {
                    b.classList.add(`f-${cIdx}`);
                }

                let num = document.createElement('div');
                num.className = 'num-label';
                num.innerText = i;
                b.appendChild(num);

                let overlay = document.createElement('div');
                overlay.className = 'ball-overlay-3d';
                b.appendChild(overlay);
                
                ballContainer.appendChild(b);
            }
            
            mainFrame.appendChild(ballContainer);

            // Høyre boks
            const boxB = document.createElement('div');
            boxB.className = `hcp-wing ${showHcp ? '' : 'hidden'}`;
            boxB.id = 'hcp-B';
            boxB.innerHTML = `Handicap: <span class="hcp-value">${hcpB}</span>`;
            mainFrame.appendChild(boxB);
        }

        // FIREBASE-STRØM
        db.ref('settings/ballStyle').on('value', snap => {
            currentBallStyle = snap.val() || 'dark';
            if (lastBallData) { renderOverlay(lastBallData); }
        });

        db.ref('balls').on('value', snap => {
            lastBallData = snap.val();
            renderOverlay(lastBallData);
        });
    </script>
</body>
</html>
