<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KØ-PÅDD Tommel-Control v40</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000;
            --accent: #ffcc00;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #0284c7;
            --border: #222;
            --ball-shine: rgba(255,255,255,0.45);
            --ball-shadow: rgba(0,0,0,0.5);
            --btn-bg: #0d0d0d;
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; outline: none; }

        html, body { 
            height: 100%; width: 100vw; margin: 0; padding: 0; 
            background: var(--bg); color: white; font-family: -apple-system, sans-serif; 
            overflow: hidden; position: fixed;
        }
        
        body { 
            padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px) 12px; 
        }

        /* 3 Hovedsoner: Topp-nav (15%), Kuler (33%), Tommel-Kontrollpanel (52%) */
        .container { 
            display: grid;
            grid-template-rows: 15% 33% 52%; 
            height: 100%; 
            width: 100%; 
        }

        /* SONE 1: TOPPEN (Nå med innstillingsknapp) */
        .top-nav { 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            gap: 4px;
            width: 100%;
            position: relative;
        }
        
        .match-id-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .name-input {
            flex: 1;
            background: var(--btn-bg); border: 1.5px solid var(--border); color: var(--accent);
            text-align: center; font-size: 22px; height: 44px;
            font-weight: 950; text-transform: uppercase; border-radius: 10px;
        }

        /* Liten fiks for tekniker-tannhjulet */
        .settings-trigger {
            background: #111;
            border: 1.5px solid var(--border);
            color: #666;
            font-size: 20px;
            height: 44px;
            width: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SKJULT TEKNIKERPANEL (Glir ned ved klikk) */
        .tech-panel {
            display: none;
            position: absolute;
            top: 48px;
            left: 0;
            width: 100%;
            background: #0a0a0a;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 10px;
            z-index: 9999;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            flex-direction: column;
            gap: 6px;
        }
        .tech-panel.open { display: flex; }

        .match-timer {
            text-align: center; font-size: 16px; font-weight: 900; color: #aaa;
            letter-spacing: 1px; text-transform: uppercase; padding: 1px 0;
        }
        .match-timer span { color: #fff; font-variant-numeric: tabular-nums; }

        .hcp-input-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px; }
        .hcp-box {
            flex: 1; background: var(--btn-bg); border: 1.5px solid var(--border); color: #fff;
            text-align: center; font-size: 22px; font-weight: 950; height: 44px; border-radius: 10px;
        }
        .hcp-box::placeholder { color: #444; }

        .hcp-toggle-btn {
            background: #1a1a1a; border: 1.5px solid #333; color: #aaa;
            font-size: 15px; font-weight: 950; height: 44px; border-radius: 10px;
            min-width: 90px; text-align: center; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center;
        }
        .hcp-toggle-btn.active { background: var(--green); border-color: #22c55e; color: #fff; }

        /* SONE 2: KULENE */
        .pool-section { 
            display: flex; justify-content: center; align-items: center; 
            width: 100%; height: 100%; overflow: hidden;
        }
        
        .ball-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px 0; 
            justify-items: center; align-content: center; width: 100%;
            transition: all 0.2s ease-in-out;
        }

        .ball-btn {
            width: 27vw; height: 27vw; max-width: 105px; max-height: 105px;
            border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.8);
            position: relative; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at 35% 35%, var(--ball-shine) 0%, rgba(255,255,255,0) 50%), 
                        radial-gradient(circle at 65% 65%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%), #fff;
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.5), 4px 6px 12px rgba(0,0,0,0.7);
            overflow: hidden; transition: all 0.2s ease-in-out;
        }

        .ball-grid.fewer-balls { gap: 30px 0; }
        .ball-grid.fewer-balls .ball-btn { width: 30vw; height: 30vw; max-width: 125px; max-height: 125px; }
        .ball-grid.fewer-balls .num-label { font-size: 8vw; }
        
        .num-label {
            background: white; color: black; width: 55%; height: 55%; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; 
            font-size: 6.5vw; font-weight: 950; border: 1.5px solid rgba(0,0,0,0.9); z-index: 10;
        }
        @media (min-width: 400px) { 
            .num-label { font-size: 26px; } 
            .ball-grid.fewer-balls .num-label { font-size: 32px; }
        }

        /* Kulestripen forblir helt urørt, flat og fin som i v37 */
        .stripe-band { position: absolute; width: 100%; height: 48%; top: 26%; z-index: 1; left: 0; }
        .sunk { opacity: 0.03 !important; filter: grayscale(1); transform: scale(0.8); }

        /* SONE 3: DET NYE DYNAMISKE TOMMELPANEL */
        .bottom-controls { 
            display: grid;
            /* 5 Rader med perfekt vektlegging for en tommel i arbeid */
            grid-template-rows: 1fr 1fr 1.2fr 1fr 1.8fr; 
            gap: 6px;
            width: 100%;
            height: 100%;
        }
        
        .btn-main { 
            background: var(--btn-bg); border: 1px solid #222; color: white; 
            font-weight: 950; text-transform: uppercase; border-radius: 12px;
            box-shadow: 0 3px 0 #000; display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%; letter-spacing: -0.5px; padding: 2px;
        }

        .split-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 100%; }
        
        /* Rad 1: Drift (Mindre viktig under spill - flyttet opp) */
        .btn-status { font-size: 20px; } 
        .btn-start { color: var(--green); border-color: rgba(22, 163, 74, 0.3); }
        .btn-stop { color: var(--red); border-color: rgba(220, 38, 38, 0.3); }

        /* Rad 2: Klokke/Avbrudd */
        .btn-sub { font-size: 18px; }

        /* Rad 3: Extension-beltet (Gjort dominerende i midten) */
        .btn-extension-huge { color: #38bdf8; font-size: 24px; font-weight: 950; border-color: rgba(2, 132, 199, 0.5); }

        /* Rad 4: Straff/Foul (Rett over hovedknappene) */
        .btn-foul { color: var(--red); border: 1.5px solid var(--red) !important; font-size: 18px; }

        /* Rad 5: Spillere (S1 / S2 er nå gigantiske og ligger helt i bunnen der tommelen hviler!) */
        .btn-player { font-size: 42px; font-weight: 950; border-radius: 14px; box-shadow: 0 4px 0 #000; } 
        .active-l { background: var(--green) !important; color: #fff; animation: flash-click 0.15s ease-out; }
        .active-r { background: var(--blue) !important; color: #fff; animation: flash-click 0.15s ease-out; }

        /* Blinking-animasjoner fra v37 */
        @keyframes flash-click { 0% { filter: brightness(0.4); } 100% { filter: brightness(1); } }
        .foul-blink { animation: flash-foul 0.15s ease-out; }
        @keyframes flash-foul { 0% { background: var(--red); color: #fff; } 100% { background: var(--btn-bg); color: var(--red); } }
        .click-blink-green { animation: flash-green-anim 0.15s ease-out; }
        @keyframes flash-green-anim { 0% { background: var(--green); color: #fff; } 100% { background: var(--btn-bg); color: var(--green); } }
        .click-blink-red { animation: flash-red-anim 0.15s ease-out; }
        @keyframes flash-red-anim { 0% { background: var(--red); color: #fff; } 100% { background: var(--btn-bg); color: var(--red); } }
        .click-blink-accent { animation: flash-accent-anim 0.15s ease-out; }
        @keyframes flash-accent-anim { 0% { background: var(--accent); color: #000; } 100% { background: var(--btn-bg); color: var(--accent); } }
        .click-blink-blue { animation: flash-blue-anim 0.15s ease-out; }
        @keyframes flash-blue-anim { 0% { background: #38bdf8; color: #fff; } 100% { background: var(--btn-bg); color: #38bdf8; } }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <div class="match-id-wrapper">
            <input type="text" id="matchIDInput" class="name-input" placeholder="MATCH ID" oninput="updateMatchID()">
            <button class="settings-trigger" onclick="toggleTechPanel()">⚙️</button>
        </div>
        
        <div class="match-timer">Tid: <span id="timerDisplay">00:00:00</span></div>
        
        <div class="hcp-input-row">
            <input type="text" id="hcpInputL" class="hcp-box" placeholder="HCP S1" oninput="updateHandicap()">
            <button id="hcpToggleBtn" class="hcp-toggle-btn active" onclick="toggleHandicapVisibility()">HCP PÅ</button>
            <input type="text" id="hcpInputR" class="hcp-box" placeholder="HCP S2" oninput="updateHandicap()">
        </div>

        <div id="techPanel" class="tech-panel">
            <div class="mode-container">
                <div class="mode-row">
                    <button id="btnReRack" class="mode-btn btn-main" style="border-color: var(--green); background: #111;" onclick="reputtActiveBalls()">♻️ RE-RACK</button>
                    <button class="mode-btn btn-main" style="background: #111;" onclick="toggleBallSet()">🎨 STIL</button>
                </div>
                <div class="mode-row" style="margin-top: 4px;">
                    <button class="mode-btn btn-main" style="background: #111;" onclick="handleModeSelection(9)">9-BALL</button>
                    <button class="mode-btn btn-main" style="background: #111;" onclick="handleModeSelection(10)">10-BALL</button>
                    <button class="mode-btn btn-main" style="background: #111;" onclick="handleModeSelection(8)">8-BALL</button>
                </div>
            </div>
        </div>
    </div>

    <div class="pool-section">
        <div class="ball-grid" id="ball-grid"></div>
    </div>

    <div class="bottom-controls">
        <div class="split-row">
            <button id="btnStart" class="btn-main btn-status btn-start" onclick="startMatch()">🟢 START</button>
            <button id="btnStop" class="btn-main btn-status btn-stop" onclick="avsluttMatch()">🔴 STOPP</button>
        </div>
        
        <div class="split-row">
            <button id="toggleBtn" class="btn-main btn-sub" onclick="handlePauseToggle()">▶ PAUSE</button>
            <button id="btnBreak" class="btn-main btn-sub" style="color: var(--accent); border-color: rgba(255, 204, 0, 0.3);" onclick="triggerBreak()">⚡ 60s BREAK</button>
        </div>
        
        <button id="btnExtension" class="btn-main btn-extension-huge" onclick="triggerExtension()">+ BRUK EXTENSION</button>
        
        <div class="split-row">
            <button id="foulL" class="btn-main btn-sub btn-foul" onclick="addFoul('left')">⚠ FOUL S1</button>
            <button id="foulR" class="btn-main btn-sub btn-foul" onclick="addFoul('right')">⚠ FOUL S2</button>
        </div>

        <div class="split-row">
            <button id="btnL" class="btn-main btn-player" onclick="shotReset('left')">◀ S1</button>
            <button id="btnR" class="btn-main btn-player" onclick="shotReset('right')">S2 ▶</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pool-balls-60509-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let ballStyle = 'classic'; 
    let currentGameMode = 9;
    let isHcpVisible = true;
    let isPaused = false;

    let matchStartTimestamp = 0;
    let timerInterval = null;
    let accumulatedTime = 0;

    function vibe(ms = 50) { if (navigator.vibrate) navigator.vibrate(ms); }

    // Åpner og lukker teknikermenyen
    function toggleTechPanel() {
        vibe(30);
        document.getElementById('techPanel').classList.toggle('open');
    }

    function applyBlink(elementId, className) {
        const el = document.getElementById(elementId);
        if (el) {
            el.classList.remove(className);
            el.offsetHeight; 
            el.classList.add(className);
            setTimeout(() => { el.classList.remove(className); }, 150);
        }
    }

    function runTimer() {
        if (matchStartTimestamp === 0 || isPaused) return;
        const totalMs = (Date.now() - matchStartTimestamp) + accumulatedTime;
        const totalSeconds = Math.floor(totalMs / 1000);
        const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;
    }

    function startTimerInterval() { if (!timerInterval) { timerInterval = setInterval(runTimer, 1000); } }
    function stopTimerInterval() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

    function updateMatchID() { vibe(30); db.ref('settings/cueScoreMatchID').set(document.getElementById('matchIDInput').value); }
    
    function updateHandicap() {
        vibe(30);
        const hcpL = document.getElementById('hcpInputL').value;
        const hcpR = document.getElementById('hcpInputR').value;
        db.ref('stats/handicap').update({ left: hcpL, right: hcpR });
    }

    function toggleHandicapVisibility() {
        vibe(40);
        isHcpVisible = !isHcpVisible;
        db.ref('stats/handicap').update({ visible: isHcpVisible });
        updateToggleBtnUI(isHcpVisible);
    }

    function updateToggleBtnUI(visible) {
        const btn = document.getElementById('hcpToggleBtn');
        if (visible) { btn.classList.add('active'); btn.innerText = "HCP PÅ"; } 
        else { btn.classList.remove('active'); btn.innerText = "HCP AV"; }
    }

    function toggleBallSet() { vibe(40); ballStyle = (ballStyle === 'classic') ? 'dark' : 'classic'; db.ref('settings/ballStyle').set(ballStyle); renderBalls(); }
    
    function reputtActiveBalls() { 
        vibe(50); 
        applyBlink('btnReRack', 'click-blink-green');
        db.ref('balls').once('value', snap => { let u = snap.val() || {}; for (let i in u) { if (u[i] === false) u[i] = true; } db.ref('balls').set(u); }); 
    }
    
    function handleModeSelection(mode) { vibe(50); document.getElementById('techPanel').classList.remove('open'); resetPool(mode); }

    const grid = document.getElementById('ball-grid');
    for (let i = 1; i <= 15; i++) {
        const b = document.createElement('div');
        b.id = `btn-${i}`; b.className = 'ball-btn';
        let numLabel = document.createElement('div'); numLabel.className = 'num-label'; numLabel.innerText = i; b.appendChild(numLabel);
        let band = document.createElement('div'); band.id = `band-${i}`; band.className = 'stripe-band'; b.appendChild(band);
        b.onclick = () => { vibe(30); const ref = db.ref(`balls/${i}`); ref.once('value').then(snap => { ref.set(snap.val() === false); }); };
        grid.appendChild(b);
    }

    function renderBalls() {
        const data = window.currentActiveData || {};
        const colors = ["", "#ffcc00", "#0055aa", "#cc0000", "#ff66aa", "#663399", "#007744", "#884422", "#000"];
        const gridElement = document.getElementById('ball-grid');
        if (currentGameMode == 9 || currentGameMode == 10) { gridElement.classList.add('fewer-balls'); } 
        else { gridElement.classList.remove('fewer-balls'); }

        for (let i = 1; i <= 15; i++) {
            const b = document.getElementById(`btn-${i}`);
            if (!b) continue;
            let show = (currentGameMode == 8) || (currentGameMode == 9 && i <= 9) || (currentGameMode == 10 && i <= 10);
            b.style.display = show ? 'flex' : 'none';
            b.classList.toggle('sunk', data[i] === false);
            if (i <= 8) { 
                const c = colors[i];
                b.style.background = `radial-gradient(circle at 35% 35%, var(--ball-shine) 0%, rgba(255,255,255,0) 50%), radial-gradient(circle at 65% 65%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%), ${c}`;
                document.getElementById(`band-${i}`).style.display='none'; 
            } else {
                const c = colors[i-8];
                const base = (ballStyle === 'dark') ? '#111' : '#fff';
                b.style.background = `radial-gradient(circle at 35% 35%, var(--ball-shine) 0%, rgba(255,255,255,0) 50%), radial-gradient(circle at 65% 65%, var(--ball-shadow) 0%, rgba(0,0,0,0) 60%), ${base}`;
                const band = document.getElementById(`band-${i}`);
                band.style.display='block'; band.style.background = c;
            }
        }
    }

    function startMatch() { 
        vibe(80); 
        applyBlink('btnStart', 'click-blink-green');
        matchStartTimestamp = Date.now();
        accumulatedTime = 0;
        isPaused = false;
        document.getElementById('toggleBtn').innerText = "▶ PAUSE";
        startTimerInterval();
        db.ref('stats').update({ startTime: matchStartTimestamp }); 
        db.ref('shotclock/visibility').set(true); 
        db.ref('activePlayer').set(""); 
        resetPool(currentGameMode); 
    }
    
    function avsluttMatch() { 
        vibe(80); 
        applyBlink('btnStop', 'click-blink-red');
        if(confirm("AVSLUTT?")) { 
            stopTimerInterval();
            matchStartTimestamp = 0;
            accumulatedTime = 0;
            isPaused = false;
            document.getElementById('timerDisplay').innerText = "00:00:00";
            document.getElementById('toggleBtn').innerText = "▶ PAUSE";
            db.ref('shotclock/visibility').set(false); 
            db.ref('stats').update({ startTime: 0 }); 
            db.ref('activePlayer').set(null); 
            db.ref('balls').set(null); 
            db.ref('shotclock/cmd').set({ action: 'stop' }); 
        } 
    }
    
    function shotReset(player) { 
        vibe(40); 
        db.ref('activePlayer').set(player); 
        db.ref('shotclock/cmd').set({ action: 'reset30', ts: Date.now() }); 
    }
    
    function resetPool(max) { let updates = {}; const limit = (max === 8) ? 15 : max; for (let i = 1; i <= 15; i++) updates[i] = (i <= limit) ? true : null; db.ref('balls').set(updates); db.ref('gameMode').set(max); }
    
    function addFoul(player) { 
        vibe(60); 
        db.ref(`stats/fouls/${player}`).transaction(c => (c || 0) + 1); 
        const btnId = player === 'left' ? 'foulL' : 'foulR';
        applyBlink(btnId, 'foul-blink');
    }
    
    function triggerBreak() { 
        vibe(60); 
        applyBlink('btnBreak', 'click-blink-accent');
        db.ref('shotclock/cmd').set({action:'reset60', ts:Date.now()}); 
    }
    
    function triggerExtension() { 
        vibe(60); 
        applyBlink('btnExtension', 'click-blink-blue');
        db.ref('activePlayer').once('value', s => { if (s.val()) db.ref(`stats/extensions/${s.val()}`).transaction(c => (c || 0) + 1); }); 
        db.ref('shotclock/cmd').set({action:'extension', ts:Date.now()}); 
    }
    
    function handlePauseToggle() {
        vibe(40);
        isPaused = !isPaused;
        const btn = document.getElementById('toggleBtn');
        if (isPaused) {
            btn.innerText = "⏸ RESUME";
            accumulatedTime += (Date.now() - matchStartTimestamp);
            matchStartTimestamp = 0;
        } else {
            btn.innerText = "▶ PAUSE";
            matchStartTimestamp = Date.now();
        }
        db.ref('shotclock/cmd').set({ action: 'toggle', ts: Date.now() });
    }

    db.ref('stats/startTime').on('value', snap => {
        const startTs = snap.val() || 0;
        if (startTs > 0) {
            if (matchStartTimestamp === 0 && !isPaused) {
                matchStartTimestamp = startTs;
                accumulatedTime = 0;
                startTimerInterval();
            }
        } else {
            stopTimerInterval();
            matchStartTimestamp = 0;
            accumulatedTime = 0;
            document.getElementById('timerDisplay').innerText = "00:00:00";
        }
    });

    db.ref('stats/handicap').on('value', snap => {
        const data = snap.val() || {};
        if (data.left !== undefined && document.activeElement !== document.getElementById('hcpInputL')) document.getElementById('hcpInputL').value = data.left;
        if (data.right !== undefined && document.activeElement !== document.getElementById('hcpInputR')) document.getElementById('hcpInputR').value = data.right;
        isHcpVisible = data.visible !== false;
        updateToggleBtnUI(isHcpVisible);
    });

    db.ref('activePlayer').on('value', snap => { const p = snap.val(); document.getElementById('btnL').className = `btn-main btn-player ${p === 'left' ? 'active-l' : ''}`; document.getElementById('btnR').className = `btn-main btn-player ${p === 'right' ? 'active-r' : ''}`; });
    db.ref('gameMode').on('value', snap => { currentGameMode = snap.val() || 9; renderBalls(); });
    db.ref('balls').on('value', snap => { window.currentActiveData = snap.val() || {}; renderBalls(); });
</script>
</body>
</html>
